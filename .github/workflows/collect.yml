name: Daily repository radar

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Collect public repository metadata
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 radar.py collect
      - name: Save observations and reports
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/snapshots reports
          if git diff --cached --quiet; then
            echo "No new observations to save."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update repository radar observations'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Report collection failures
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          echo 'Collection failed or was incomplete. Any partial observations were saved with their errors.'
          exit 1
